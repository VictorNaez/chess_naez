<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>

<script>
  // Errores JS no capturados: siempre los enviamos (son raros y críticos)
  window.onerror = function (msg, url, line, col) {
    window.ReactNativeWebView.postMessage('[SF] JS-ERROR: ' + msg + ' @ ' + url + ':' + line + ':' + col);
    return true;
  };
</script>

<script>
  // --- MODO DEBUG ---
  var DEBUG = false;
  function dbg(msg) {
    if (DEBUG) window.ReactNativeWebView.postMessage(msg);
  }

  // --- INTERCEPTACIÓN DE CONSOLA ---
  // OJO: este build de Stockfish emite parte de su salida UCI por console.log,
  // no solo por el callback print(). Si se elimina, el motor deja de responder.
  // La diferencia con la versión original es que ya NO hacemos postMessage
  // de todo: lo enrutamos por routeEngineLine(), que filtra y agrupa.
  var oldLog = console.log;
  console.log = function () {
    var msg = Array.prototype.join.call(arguments, ' ');
    if (typeof routeEngineLine === 'function') {
      routeEngineLine(msg);
    } else {
      window.ReactNativeWebView.postMessage('[SF-OUT] ' + msg);
    }
    if (DEBUG) oldLog.apply(console, arguments);
  };

  var oldWarn = console.warn;
  console.warn = function () {
    dbg('[SF-CONSOLE.WARN] ' + Array.prototype.join.call(arguments, ' '));
    if (DEBUG) oldWarn.apply(console, arguments);
  };

  var oldError = console.error;
  console.error = function () {
    var msg = Array.prototype.join.call(arguments, ' ');
    // Los errores sí los dejamos pasar: pueden contener el crash del WASM
    window.ReactNativeWebView.postMessage('[SF-CONSOLE.ERROR] ' + msg);
    if (DEBUG) oldError.apply(console, arguments);
  };
</script>

<script>
  // --- POLYFILL fetch() para file:// (necesario en Android WebView) ---
  window.fetch = function (url) {
    dbg('[SF] FETCH-POLYFILL-XHR: ' + url);
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function () {
        if (xhr.status === 200 || xhr.status === 0) {
          resolve({
            ok: true,
            status: 200,
            arrayBuffer: function () { return Promise.resolve(xhr.response); },
            headers: { get: function () { return null; } }
          });
        } else {
          reject(new Error('XHR status ' + xhr.status));
        }
      };
      xhr.onerror = function () {
        reject(new Error('XHR network error: ' + url));
      };
      xhr.send(null);
    });
  };
</script>

<!-- chess.js empaquetado (global ChessLib): convierte las PV a SAN aquí, con el
     JIT de V8 de la WebView, en vez de en el hilo JS de React Native. -->
<script src="./chess-1.4.0.cjs"
        onerror="window.ReactNativeWebView.postMessage('[SF] JS-ERROR: CHESS-SCRIPT-404-OR-ERROR')"></script>

<script>
  var module = { exports: {} };
  var exports = module.exports;
</script>

<script src="./stockfish-18-lite-single.cjs"
        onload="dbg('[SF] CJS-SCRIPT-LOADED-OK')"
        onerror="window.ReactNativeWebView.postMessage('[SF] JS-ERROR: CJS-SCRIPT-404-OR-ERROR')"></script>

<script>
  var _raw = module.exports;
  var _factory = (_raw && typeof _raw.default === 'function') ? _raw.default : _raw;
  if (typeof _factory === 'function') {
    window.Stockfish = _factory;
  }
  dbg('[SF] typeof Stockfish=' + typeof Stockfish);

  var engine = null;
  var engineWarm = false;
  var pendingCommands = [];
  var commandChain = Promise.resolve();

  // --- ESTADO DE LA BÚSQUEDA (lo actualiza sendToEngine al EJECUTAR cada comando) ---
  var positionFen = null;      // último 'position fen' ejecutado
  var searchFen = null;        // FEN de la búsqueda en curso (se fija en el 'go')
  var expectedMultiPV = 1;     // último 'setoption name MultiPV' ejecutado
  var firstInfoPending = false;

  // --- AGRUPADO de líneas 'info' ---
  // Se guarda la última línea de cada multipv y se envían TODAS en un único
  // postMessage (antes era un mensaje por línea: 3 eventos del puente y 3
  // renders en React Native por cada vaciado).
  //
  // Esta build solo devuelve el control al event loop cada ~45 ms mientras
  // busca (medido), así que un timer nunca salta antes. postMessage, en cambio,
  // se puede llamar de forma síncrona desde print(): cuando llega la última
  // línea multipv de una profundidad se envía ya, sin timer, si es la primera
  // de la búsqueda o han pasado FLUSH_INTERVAL_MS desde el último envío. El timer queda
  // para lo que no completa ráfaga (posiciones con menos jugadas que MultiPV).
  var FLUSH_INTERVAL_MS = 120;
  var infoBuffer = {};
  var flushTimer = null;
  var lastFlushAt = 0;
  var sanCache = {};           // multipv -> { fen, pv, san }

  // --- PROFUNDIDAD MÍNIMA PARA PUBLICAR ---
  // Las iteraciones 1..7 salen casi todas seguidas en los primeros milisegundos
  // del 'go', justo cuando la pieza se está animando en el otro proceso, y su
  // evaluación no le dice nada a nadie (la flecha además baila). Se siguen
  // guardando en infoBuffer (siempre la última de cada multipv), pero no
  // disparan vaciado: si la búsqueda acabara antes de llegar al umbral, el
  // flushInfo() del 'bestmove' las publica igual.
  var MIN_PUBLISH_DEPTH = 8;
  var minPublishDepth = MIN_PUBLISH_DEPTH;   // se recorta si el 'go depth N' pide menos

  // Misma conversión que src/lib/uci.ts (uciLineToSan): se corta en la primera
  // jugada ilegal.
  function pvToSan(fen, pv) {
    if (!window.ChessLib || !fen || !pv) return null;
    var scratch;
    try { scratch = new ChessLib.Chess(fen); } catch (e) { return null; }
    var moves = pv.split(' ');
    var san = [];
    for (var i = 0; i < moves.length; i++) {
      var uci = moves[i];
      if (!uci || uci.length < 4) break;
      try {
        var move = scratch.move({
          from: uci.substring(0, 2),
          to: uci.substring(2, 4),
          promotion: uci.length === 5 ? uci[4] : 'q'
        });
        if (!move) break;
        san.push(move.san);
      } catch (e) {
        break;
      }
    }
    return san;
  }

  function flushInfo() {
    if (flushTimer) { clearTimeout(flushTimer); flushTimer = null; }
    var keys = Object.keys(infoBuffer);
    if (keys.length === 0) return;
    var out = [];
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var line = infoBuffer[key];
      out.push('[SF-OUT] ' + line);
      // La PV en SAN va justo detrás de su línea, en el mismo mensaje.
      var pvAt = line.indexOf(' pv ');
      if (pvAt !== -1 && searchFen) {
        var pv = line.substring(pvAt + 4).trim();
        var cached = sanCache[key];
        var san = (cached && cached.fen === searchFen && cached.pv === pv)
          ? cached.san
          : pvToSan(searchFen, pv);
        sanCache[key] = { fen: searchFen, pv: pv, san: san };
        if (san) out.push('[SF-SAN] ' + key + ' ' + san.join(' '));
      }
    }
    infoBuffer = {};
    lastFlushAt = Date.now();
    window.ReactNativeWebView.postMessage(out.join('\n'));
  }

  // indexOf en vez de regex: este código corre en el mismo hilo que el WASM,
  // así que cada microsegundo aquí es tiempo de búsqueda que le quitamos al motor.
  // ' depth ' solo casa con la de la iteración: en ' seldepth ' no hay espacio
  // delante de la 'd'.
  function lineDepth(line) {
    var i = line.indexOf(' depth ');
    if (i === -1) return 0;
    var start = i + 7;
    var end = line.indexOf(' ', start);
    return parseInt(end === -1 ? line.substring(start) : line.substring(start, end), 10) || 0;
  }

  function multipvKey(line) {
    var i = line.indexOf(' multipv ');
    if (i === -1) return '1';
    var start = i + 9;
    var end = line.indexOf(' ', start);
    return end === -1 ? line.substring(start) : line.substring(start, end);
  }

  function queueInfo(line) {
    var key = multipvKey(line);
    infoBuffer[key] = line;
    if (lineDepth(line) < minPublishDepth) return;
    var burstComplete = Number(key) >= expectedMultiPV;
    if (burstComplete && (firstInfoPending || Date.now() - lastFlushAt >= FLUSH_INTERVAL_MS)) {
      firstInfoPending = false;
      flushInfo();
      return;
    }
    if (!flushTimer) {
      flushTimer = setTimeout(flushInfo, FLUSH_INTERVAL_MS);
    }
  }

    // --- ENRUTADOR ÚNICO DE SALIDA DEL MOTOR ---
  // Todas las líneas del motor pasan por aquí, vengan de print() o de console.log.
  function routeEngineLine(line) {
    if (typeof line !== 'string' || !line) return;

    // Líneas 'info' sin score: ruido puro (currmove, nps, hashfull...)
    if (line.indexOf('info ') === 0) {
      if (line.indexOf(' score ') === -1) return;
      queueInfo(line);
      return;
    }

    // 'bestmove': vaciamos el buffer primero para no llegar tarde al resultado
    if (line.indexOf('bestmove') === 0) {
      flushInfo();
    }

    window.ReactNativeWebView.postMessage('[SF-OUT] ' + line);
  }

  function reportEngineError(cmd, e) {
    var msg = String(e);
    window.ReactNativeWebView.postMessage('[SF] SYNC-THROW -> ' + cmd + ': ' + msg);
    if (msg.indexOf('memory access out of bounds') !== -1 || msg.indexOf('RuntimeError') !== -1) {
      window.ReactNativeWebView.postMessage('[SF] FATAL-CRASH');
    }
  }

  // Estado que depende del comando, fijado en el orden real de ejecución.
  function trackCommand(cmd) {
    if (cmd.indexOf('position fen ') === 0) {
      positionFen = cmd.substring(13).split(' moves ')[0];
    } else if (cmd.indexOf('go') === 0) {
      searchFen = positionFen;
      firstInfoPending = true;
      infoBuffer = {};
      // Un 'go depth 6' nunca alcanzaría el umbral: ahí el umbral es la propia
      // profundidad pedida.
      var goDepth = cmd.indexOf('go depth ') === 0 ? parseInt(cmd.substring(9), 10) : 0;
      minPublishDepth = goDepth > 0 ? Math.min(MIN_PUBLISH_DEPTH, goDepth) : MIN_PUBLISH_DEPTH;
      if (flushTimer) { clearTimeout(flushTimer); flushTimer = null; }
    } else if (cmd.indexOf('setoption name MultiPV value ') === 0) {
      expectedMultiPV = parseInt(cmd.substring(29), 10) || 1;
    }
  }

  // --- 'stop' FUERA DE LA CADENA ---
  // Con esta build la promesa de un 'go' no resuelve hasta que la búsqueda
  // TERMINA. Si 'stop' fuera por commandChain esperaría detrás de ese 'go' y no
  // pararía nada: el bestmove llegaba cuando la búsqueda acababa sola (o saltaba
  // el timeout de 2 s en React Native). Medido con este mismo .wasm: por la
  // cadena, un 'go depth 40' seguía buscando pasados 120 s; llamado directamente,
  // el bestmove llega en 0 ms. 'stop' solo activa un flag que la búsqueda mira
  // cuando retoma, así que es seguro llamarlo mientras el 'go' está suspendido.
  var pendingGo = 0;          // 'go' recibidos que aún no han arrancado
  var stopAfterGo = false;    // llegó un 'stop' con un 'go' todavía en la cola

  function stopNow() {
    try {
      engine.ccall('command', null, ['string'], ['stop'], { async: false });
    } catch (e) {
      reportEngineError('stop', e);
    }
  }

  function sendToEngine(cmd) {
    dbg('[SF] enviando -> ' + cmd);
    commandChain = commandChain.then(function () {
      trackCommand(cmd);
      try {
        if (typeof engine.ccall === 'function') {
          var result = engine.ccall('command', null, ['string'], [cmd], { async: true });
          if (cmd.indexOf('go') === 0) {
            // El ccall vuelve en cuanto la búsqueda cede el control por primera
            // vez: ya está en marcha y se puede parar.
            pendingGo = Math.max(0, pendingGo - 1);
            if (stopAfterGo) { stopAfterGo = false; stopNow(); }
          }
          return Promise.resolve(result).catch(function (e) { reportEngineError(cmd, e); });
        } else {
          window.ReactNativeWebView.postMessage('[SF] FATAL: ccall no existe en el motor.');
        }
      } catch (e) {
        reportEngineError(cmd, e);
      }
    });
    return commandChain;
  }

  function flushQueue() {
    dbg('[SF] flushQueue count=' + pendingCommands.length);
    pendingCommands.forEach(sendToEngine);
    pendingCommands = [];
  }

  function receive(cmd) {
    dbg('[SF] receive() cmd=' + cmd + ' engineWarm=' + engineWarm);
    if (cmd === 'stop' && engineWarm) {
      if (pendingGo > 0) stopAfterGo = true;   // se para nada más arrancar
      else stopNow();
      return;
    }
    if (typeof cmd === 'string' && cmd.indexOf('go') === 0) pendingGo++;
    if (engineWarm) {
      sendToEngine(cmd);
    } else {
      pendingCommands.push(cmd);
    }
  }

  document.addEventListener('message', function (e) { receive(e.data); });
  window.addEventListener('message', function (e) { receive(e.data); });

  try {
    Stockfish({
      locateFile: function (path) {
        return path.endsWith('.wasm') ? 'stockfish-18-lite-single_wasm.wasm' : path;
      },
      
      print: function (line) { routeEngineLine(line); },
      printErr: function (line) {
        dbg('[SF] STDERR: ' + line);
      }
    }).then(function (sf) {
      dbg('[SF] ENGINE-PROMISE-RESOLVED');
      engine = sf;

      // Sin espera fija (antes 200 ms): el motor acepta comandos en cuanto la
      // promesa resuelve, y quien lo usa no manda 'position'/'go' hasta recibir
      // 'readyok' del handshake.
      engineWarm = true;
      dbg('[SF] engineWarm=true');
      flushQueue();

      // Primera conversión a SAN aquí, con el motor recién creado: el JIT de V8
      // compila chess.js ahora y no en el primer lote de líneas del análisis
      // (en frío, esa primera conversión se come ~20 ms).
      pvToSan('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', 'e2e4 e7e5 g1f3 b8c6 f1b5');

    }).catch(function (err) {
      window.ReactNativeWebView.postMessage('[SF] JS-ERROR: ENGINE-PROMISE-REJECTED: ' + String(err));
    });
  } catch (e) {
    window.ReactNativeWebView.postMessage('[SF] JS-ERROR: SYNC-THROW calling Stockfish(): ' + String(e));
  }
</script>
</body>
</html>
