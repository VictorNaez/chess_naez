plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pgssavedgames'
version = '0.1.0'

android {
  namespace "expo.modules.pgssavedgames"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // SDK v2 de Play Games Services. El v1 dejó de admitir integraciones nuevas
  // en Play y desaparece en 2026, así que aquí no hay elección que valorar.
  implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
}
